[env]
TERM = "xterm-256color"

[font]
size = 12.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[scrolling]
history = 5000

[window]
opacity = 0.9

[window.class]
general = "Alacritty"
instance = "Alacritty"

[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]
live_config_reload = true


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
